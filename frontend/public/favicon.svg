<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Gradients matching Knowvia Palette -->
    <linearGradient id="bookLeftGrad" x1="12" y1="24" x2="32" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7A2E44"/>
      <stop offset="100%" stop-color="#5B2333"/>
    </linearGradient>
    <linearGradient id="bookRightGrad" x1="32" y1="24" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D67B8B"/>
      <stop offset="100%" stop-color="#C86B7B"/>
    </linearGradient>
    <linearGradient id="pathway1Grad" x1="20" y1="38" x2="38" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B2333"/>
      <stop offset="50%" stop-color="#C86B7B"/>
      <stop offset="100%" stop-color="#F4B6A6"/>
    </linearGradient>
    <linearGradient id="pathway2Grad" x1="28" y1="44" x2="48" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C86B7B"/>
      <stop offset="100%" stop-color="#F4B6A6"/>
    </linearGradient>
    <filter id="glow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#5B2333" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Open Book Base -->
  <g filter="url(#glow3d)">
    <!-- Left Page -->
    <path d="M 12,28 C 18,24 26,24 32,27 L 32,50 C 26,47 18,47 12,51 Z" fill="url(#bookLeftGrad)" />
    <!-- Right Page -->
    <path d="M 52,28 C 46,24 38,24 32,27 L 32,50 C 38,47 46,47 52,51 Z" fill="url(#bookRightGrad)" />
    <!-- Book Center Spine -->
    <path d="M 31,27 L 33,27 L 33,50 L 31,50 Z" fill="#FFF8F3" opacity="0.6"/>

    <!-- Flowing Pathway 1 (Left to Right Sweep Arrow) -->
    <path d="M 18,36 C 22,26 28,18 36,12 C 38,10.5 41,12 40,14 C 34,22 26,29 20,38 Z" fill="url(#pathway1Grad)"/>

    <!-- Flowing Pathway 2 (Right to Upward Sweep Arrow) -->
    <path d="M 46,36 C 42,28 36,20 28,14 C 26,12.5 24,14 26,16 C 32,22 38,30 44,38 Z" fill="url(#pathway2Grad)"/>

    <!-- Learning Sparkle (Star) Top Right -->
    <path d="M 44,8 L 45.5,12 L 49.5,13.5 L 45.5,15 L 44,19 L 42.5,15 L 38.5,13.5 L 42.5,12 Z" fill="#F4B6A6"/>
    <circle cx="44" cy="13.5" r="1.5" fill="#FFF8F3"/>
  </g>
</svg>